name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: itsyourworld
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Wasp CLI
        run: npm install -g @wasp.sh/wasp-cli@0.26.0 && wasp version

      - name: Write env files
        run: bash .devcontainer/env.sh

      - name: Install dependencies
        run: bash scripts/ci-run.sh install wasp install

      - name: Compile (type-checks the app)
        run: bash scripts/ci-run.sh compile wasp compile

      - name: Apply migrations
        run: |
          bash scripts/ci-run.sh migrate wasp db migrate-dev --name ci-check
          # Fail if the schema changed without a committed migration.
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error title=migrations::schema.prisma has changes without a committed migration. Run 'wasp db migrate-dev' and commit the migrations folder."
            exit 1
          fi

      - name: Seed demo data
        run: bash scripts/ci-run.sh seed wasp db seed

      - name: Production build
        run: bash scripts/ci-run.sh build wasp build

      - name: Smoke test (auth + ownership)
        # Runs with fake Codespaces env vars so the Vite proxy path that
        # Codespaces uses (port 3000 -> /server -> 3001) is tested too.
        env:
          CODESPACES: "true"
          CODESPACE_NAME: ci-smoke
        run: |
          (wasp start > wasp.log 2>&1 &)
          for port in 3001 3000; do
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/ || true)
              [ "$code" != "000" ] && break
              sleep 2
            done
          done
          fail() { bash scripts/ci-run.sh server-log bash -c 'tail -80 wasp.log; exit 1'; exit 1; }
          echo "== Direct to server"
          bash scripts/ci-run.sh smoke-test-direct bash scripts/smoke-test.sh http://localhost:3001 || fail
          echo "== Through the Vite proxy (Codespaces path)"
          bash scripts/ci-run.sh smoke-test-proxy bash scripts/smoke-test.sh http://localhost:3000/server || fail
          echo "== Client page is served"
          curl -sf http://localhost:3000/ | grep -qi '<html' || { echo "::error title=client::index page missing root div"; fail; }

      - name: Browser check (simulated Codespaces)
        if: always()
        run: |
          npm install --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          echo "== HTML request with browser Accept header"
          curl -s -m 30 -o /tmp/page.html -w "status %{http_code}, %{time_total}s\n" -H "Accept: text/html,application/xhtml+xml" -H "Host: ci-smoke-3000.app.github.dev" http://localhost:3000/ || echo "curl failed"
          head -c 600 /tmp/page.html; echo
          bash scripts/ci-run.sh browser-check node e2e/browser-check.mjs

      - name: Server log
        if: always()
        run: cat wasp.log || true

  devcontainer:
    # Builds the Codespaces dev container, runs its setup script and checks
    # that the app answers inside it, the same way a new codespace starts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dev container CLI
        run: npm install -g @devcontainers/cli
      - name: Build container
        run: bash scripts/ci-run.sh devcontainer-build devcontainer up --workspace-folder . --skip-post-create
      - name: Run Codespaces setup script
        run: bash scripts/ci-run.sh devcontainer-setup devcontainer exec --workspace-folder . bash .devcontainer/setup.sh
      - name: Start app and smoke test
        run: |
          devcontainer exec --workspace-folder . bash -c '(wasp start > /tmp/wasp.log 2>&1 &); for i in $(seq 1 150); do c=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true); [ "$c" = "200" ] && break; sleep 2; done; sleep 10; echo "client: $c"'
          bash scripts/ci-run.sh devcontainer-smoke devcontainer exec --workspace-folder . bash scripts/smoke-test.sh http://localhost:3001 \
            || { bash scripts/ci-run.sh devcontainer-log devcontainer exec --workspace-folder . bash -c 'tail -60 /tmp/wasp.log; exit 1'; exit 1; }
